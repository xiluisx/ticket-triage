name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint (ruff, incl. security rules)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests
        run: uv run pytest --cov-report=xml

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: fmt
        run: terraform fmt -check -recursive infra
      - name: validate
        run: |
          for dir in infra/bootstrap infra/terraform; do
            terraform -chdir=$dir init -backend=false -input=false
            terraform -chdir=$dir validate
          done

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config scan
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.58.1 \
            config --severity HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore infra
