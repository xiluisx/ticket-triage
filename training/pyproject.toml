[project]
name = "training"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35",
    "httpx>=0.28",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "triage-core",
]

[tool.uv.sources]
triage-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/training"]
